name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Prepare release
        id: release
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main --tags
          git checkout -B main origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          package_name="$(node -p "require('./package.json').name")"
          local_version="$(node -p "require('./package.json').version")"
          published_version="$(npm view "$package_name" version)"
          release_version="$(node scripts/release-version.mjs "$local_version" "$published_version")"

          if [[ "$local_version" == "$published_version" ]]; then
            npm version "$release_version" -m "Release %s [skip ci]"
          else
            git rev-parse "v$release_version" >/dev/null 2>&1 || git tag -a "v$release_version" -m "Release $release_version"
          fi
          git push origin HEAD:main --follow-tags

          echo "version=$release_version" >> "$GITHUB_OUTPUT"

      - name: Publish ${{ steps.release.outputs.version }}
        run: npm publish

  mirror:
    name: Mirror to GitHub Packages
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v${{ needs.publish.outputs.version }}

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com
          scope: "@giladbarnea"
          package-manager-cache: false

      - name: Publish ${{ needs.publish.outputs.version }}
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v${{ needs.publish.outputs.version }}
          fetch-depth: 0

      - name: Release ${{ needs.publish.outputs.version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ needs.publish.outputs.version }}"
          previous_tag="$(git describe --tags --abbrev=0 HEAD^)"
          notes_file="$(mktemp)"
          {
            printf 'Published to [npm](https://www.npmjs.com/package/@giladbarnea/pi-simple-team/v/%s).\n\n' "$version"
            if [[ -f "releases/$version.md" ]]; then
              cat "releases/$version.md"
            else
              printf '## Changes\n\n'
              git log \
                --format="- %s ([%h]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/%H))" \
                "$previous_tag..HEAD"
            fi
          } > "$notes_file"
          gh release create "v$version" \
            --generate-notes \
            --notes-file "$notes_file" \
            --notes-start-tag "$previous_tag" \
            --title "v$version" \
            --verify-tag
